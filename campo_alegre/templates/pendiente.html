{% extends 'layout.html' %}
{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
<div>
  <h2 class="h4 m-0 ca-title">{{ titulo }}</h2>
  <p class="text-secondary m-0">{{ resumen }}</p>
</div>
<section class="ca-panel p-3 p-md-4">
  <span class="ca-pill warn">Módulo en construcción</span>
  <h3 class="h6 mt-3">Cuando esté listo incluirá</h3>
  <ul class="text-secondary mb-0">
    {% for item in incluira %}<li>{{ item }}</li>{% endfor %}
  </ul>
</section>
{% endblock %}
